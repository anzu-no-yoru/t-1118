<title>ボイ！</title>
<!--
  ボイ！（仮）── 音だけで遊ぶブラインドサッカーの一人称 ── ステップ1（最小実装）
  方針の正本：Game/Soccer/方針.md（§9 ステップ1）
  音は全部 Web Audio でその場で作る（音のファイルなし）。方向と距離は PannerNode（HRTF）。
  確かめ方：
    ?watch      上から見たピッチと音の波紋（見る人・撮影用）
    ?bot        自動で遊ぶ（?watch&bot で見る）。 ?fast=N で N 倍速
    ?seed=N     置き場所を固定
    ?lv=1..5    暗さ（1＝波紋あり、5＝真っ暗）。L キーで 1⇔5
    ?lang=en    言葉を英語に
    ?type=attack1|attack2|defend  場面を固定（ステップ2：相手1人・相手2人・守り）。 ?opp=0 で相手なし
    ?tut        はじめてのお手本をもう一度（ふつうは1回だけ・localStorage voy_tut）
  コンソール：
    calib(10)     音だけで向いて Space＝ズレ（度）を記録
    lrtest(10)    左右の聞き分けを10回
    simRounds(20,seed)  自動で20本（音なし・すぐ終わる）→ 到達とゴールの数
-->

/* ====================== 本物の数字（方針.md §1・§6） ====================== */
const PL = 40, PW = 20;                 // ピッチ 40 × 20 m
const GY = PW / 2, GHW = 3.66 / 2;      // ゴール 内のり 3.66 m
const POST_R = 0.04;                    // ポスト 8 cm
const BR = 0.1, PR = 0.35;              // ボール半径・選手半径
const DT = 1 / 60;
const TURN = 120 * Math.PI / 180;       // 毎秒 120°
const VRUN = 5, VDASH = 7, VBACK = 2;   // m/s
const VSIDE = 3, VSIDE_BALL = 2.5;      // 横歩き（正面を向いたまま）は前の 6 割・ボールを持っていると 5 割
const FRIC = 0.8, DRAG = 0.3;           // 転がりの減速 0.8 m/s² ＋ 速さに比例
const REST_BOARD = 0.5;                 // 板の反発
const ATT_X = PL - 12;                  // 攻めの 1/3（ゴールラインから 12 m）

/* ====================== 種つき乱数 ====================== */
function rng32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ====================== 世界（音から切りはなした物理） ====================== */

const TYPE_FIX = ['attack1', 'attack2', 'defend'].includes(Q.get('type')) ? Q.get('type') : null;

const IS_TOUCH = Q.has('touch') || !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const THUMB = !Q.has('nothumb');   // 試しのページでは最初から親指モード   // 親指モード（試し・2026-11-16）：置いた所が真ん中の親指スティック＋もう 1 本の指で蹴る
const TYPES = ['attack1', 'defend', 'attack2'];   // 1本目＝相手1人を抜く、2本目＝守る、3本目＝相手2人
const OTURN = Math.PI;                   // 相手は毎秒 180° 回る
const OPRESS = 4.2, OGUARD = 2.4, OCARRY = 3.2;   // m/s（寄せる・待つ・運ぶ）
const VOY_OK = 2.5;                      // 「ボイ！」と叫んでから 2.5 秒は寄せてよい（IBSA Law 12：寄せる前にはっきり言う）
// 場面の順：はじめの 2 本は相手なし（ウォームアップ）→ 相手1人 → 守り → 相手2人 をくり返す
const typeFor = i => !OPP_ON ? 'solo' : TYPE_FIX || (i < 2 ? 'solo' : TYPES[(i - 2) % 3]);

  if (W.type === 'pk' && MODE.m === 'play') { const k = W.pk; document.getElementById('hud').textContent = `PK ${k.score[PKME]}-${k.score[pkOther(PKME)]} · ${Math.min(PK_N * 2, k.n + 1)}/${PK_N * 2} · ${k.kicker === PKME ? '⚽' : '🧤'} · ${T.lvName(LV)}` + (BOT ? ' · BOT' : ''); return; }
  document.getElementById('hud').textContent = MODE.m === 'play'
    ? (COACH.hold ? T.hold + ' · ' : '') + (W.mode === 'match' ? `⚽ ${W.score[0]}-${W.score[1]} · ${Math.max(0, Math.ceil(MATCH_T - W.matchT))}s · ` : W.mode === 'daily' ? '📅 · ' : '') + `${T.lvName(LV)} · ${T.tname[W.type]} · ${W.roundT.toFixed(1)}s · ${T.touch} ${W.touches}` + (tl ? ` · ≤60s ${tl.k}/${tl.m}` : '') + (FLIP ? ' · ' + T.swapped : '') + (BOT ? ' · BOT' : '')
    : '';
}
// 一人称：真っ暗。中央に息の明滅。音の場所に薄い波紋
function drawFP() {
  g.fillStyle = '#000'; g.fillRect(0, 0, CW, CH);
  const t = performance.now() / 1000, P = W.P;
  const per = 3.2 - 1.6 * P.exert, ph = 0.5 + 0.5 * Math.sin(t * 2 * Math.PI / per);
  const R = Math.min(CW, CH) * (0.08 + 0.04 * ph);
  const gr = g.createRadialGradient(CW / 2, CH / 2, 0, CW / 2, CH / 2, R);
  gr.addColorStop(0, `rgba(70,80,100,${0.07 + 0.06 * ph})`); gr.addColorStop(1, 'rgba(70,80,100,0)');
  g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
  if (MODE.m === 'play') { drawScene(LV); drawHoldGlow(); }
  const al = LV_ALPHA[LV]; if (al <= 0 || MODE.m !== 'play') { pruneRip(t); return; }
  const fpx = CW * 0.5 / Math.tan(50 * Math.PI / 180), hor = CH * 0.42;
  for (const r of RIP) {
    const age = t - r.t0, life = 1.3 * r.big ** 0.3; if (age > life || age < 0) continue;
    const a = al * (1 - age / life), q = rel(r.x, r.y), rad = (0.25 + age * 0.9) * r.big * (LV <= 2 ? 1 : 0.7);
    g.strokeStyle = `rgba(${RIPCOL[r.kind]},${a})`; g.lineWidth = 2;
    const th = Math.atan2(q.r, q.f);
    if (q.f > 0.3 && Math.abs(th) < 50 * Math.PI / 180) {
      const sx = CW / 2 + q.r / q.f * fpx, sy = Math.min(CH - 8, hor + 1.6 / q.f * fpx * 0.55);
      const rr = Math.max(3, rad / q.f * fpx * 0.6);
      g.beginPath(); g.ellipse(sx, sy, rr, rr * 0.35, 0, 0, Math.PI * 2); g.stroke();
    } else {
      // 横・うしろの音は画面のふちに
      const side = q.r >= 0 ? 1 : -1, back = clamp((Math.abs(th) - Math.PI / 2) / (Math.PI / 2), -1, 1);
      const sx = side > 0 ? CW - 6 : 6, sy = hor + CH * 0.4 * Math.max(0, back) - CH * 0.15 * Math.max(0, -back);
      const rr = 14 + age * 40;
      g.beginPath(); g.arc(sx, sy, rr, side > 0 ? Math.PI * 0.5 : -Math.PI * 0.5, side > 0 ? Math.PI * 1.5 : Math.PI * 0.5); g.stroke();
    }
  }
  pruneRip(t);
}
// 見える練習：レベル 1＝ちゃんと見える一人称（空・地面・ライン・板の壁・ゴール・ボール・相手）、
// 2＝半透明、3＝輪郭だけ、4＝波紋だけ、5＝真っ暗。見える練習でも、コーチの声・ピッ・鈴は全部鳴る（耳の使い方をここで覚える）
const PITCH = 25 * D2R, CPI = Math.cos(PITCH), SPI = Math.sin(PITCH), CAMH = 1.6;
function fpFocal() { return CW * 0.5 / Math.tan(55 * D2R); }     // 横の見える角度 110°
function proj(wx, wy, wz, fp) {   // 頭の高さ 1.6 m・25° 下を向いた目から見た画面の位置
  const q = rel(wx, wy), u = wz - CAMH, depth = q.f * CPI - u * SPI;
  if (depth < 0.25) return null;
  const vert = q.f * SPI + u * CPI;
  return { x: CW / 2 + q.r / depth * fp, y: CH / 2 - vert / depth * fp, d: depth };
}
function polyW(pts, fp) {   // 線（見えない所で切る）
  let on = false; g.beginPath();
  for (const [x, y, z] of pts) {
    const p = proj(x, y, z, fp);
    if (!p) { on = false; continue; }
    if (on) g.lineTo(p.x, p.y); else { g.moveTo(p.x, p.y); on = true; }
  }
  g.stroke();
}
function lineW(a, b, n, fp) { const pts = []; for (let i = 0; i <= n; i++) { const k = i / n; pts.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]); } polyW(pts, fp); }
function quadW(c, fp) {   // 4 つの角の面（1 つでも見えなければ描かない）
  const ps = c.map(([x, y, z]) => proj(x, y, z, fp)); if (ps.some(p => !p)) return null;
  g.beginPath(); g.moveTo(ps[0].x, ps[0].y); for (let i = 1; i < 4; i++) g.lineTo(ps[i].x, ps[i].y); g.closePath(); return ps;
}
function onScreen(wx, wy, wz, fp) { const p = proj(wx, wy, wz, fp); return p && p.x > 0 && p.x < CW; }
function drawScene(lv) {
  if (lv >= 4) return;
  const fp = fpFocal(), B = W.B, fill = lv === 1 ? 1 : lv === 2 ? 0.5 : 0, edge = lv === 3 ? 0.6 : 1;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  // 空と地面（地平線で分ける）
  const hy = CH / 2 - SPI / CPI * fp;
  if (fill) {
    const sky = g.createLinearGradient(0, 0, 0, Math.max(1, hy));
    sky.addColorStop(0, `rgba(10,22,48,${fill})`); sky.addColorStop(1, `rgba(40,66,110,${fill})`);
    g.fillStyle = sky; g.fillRect(0, 0, CW, Math.max(0, hy));
    const gr = g.createLinearGradient(0, hy, 0, CH);
    gr.addColorStop(0, `rgba(30,78,44,${fill})`); gr.addColorStop(1, `rgba(44,118,62,${fill})`);
    g.fillStyle = gr; g.fillRect(0, hy, CW, CH - hy);
  }
  g.strokeStyle = `rgba(150,170,200,${0.5 * edge})`; g.lineWidth = 1; g.beginPath(); g.moveTo(0, hy); g.lineTo(CW, hy); g.stroke();
  // 白いライン（ゴールライン・センター・センターサークル・3 分の 1 の点線・PK 6 m と 8 m）
  g.strokeStyle = `rgba(235,240,235,${0.7 * edge})`; g.lineWidth = 2;
  for (const x of [0, PL / 2, PL]) lineW([x, 0, 0], [x, PW, 0], 40, fp);
  { const pts = []; for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2; pts.push([PL / 2 + Math.cos(a) * 5, GY + Math.sin(a) * 5, 0]); } polyW(pts, fp); }
  g.setLineDash([8, 10]); for (const x of [12, PL - 12]) lineW([x, 0, 0], [x, PW, 0], 40, fp); g.setLineDash([]);
  g.fillStyle = `rgba(235,240,235,${0.8 * edge})`;
  for (const x of [6, 8, PL - 6, PL - 8]) { const p = proj(x, GY, 0, fp); if (p) { g.beginPath(); g.arc(p.x, p.y, Math.max(1.5, 0.12 / p.d * fp), 0, Math.PI * 2); g.fill(); } }
  // 板（高さ 1.1 m の壁・1 m ごとの面）
  for (const y of [0, PW]) for (let x = -1; x < PL + 1; x++) {
    const ps = quadW([[x, y, 0], [x + 1, y, 0], [x + 1, y, 1.1], [x, y, 1.1]], fp); if (!ps) continue;
    if (fill) { g.fillStyle = `rgba(205,210,222,${0.88 * fill})`; g.fill(); }
    g.strokeStyle = `rgba(120,128,145,${0.8 * edge})`; g.lineWidth = 1; g.stroke();
  }
  // ゴール（ポストとバーは白・ネットはうすく）。相手のゴールの裏にガイド
  const gp = proj(PL + 1.6, GY, 1.0, fp);
  if (gp) drawPerson(gp, 0.22, `rgba(232,196,90,${fill ? 0.9 : 0.6 * edge})`, fp, PL + 1.6, GY, fill);
  for (const [x, dir, a] of [[PL, 1, 1], [0, -1, 0.55]]) {
    const y1 = GY - GHW, y2 = GY + GHW, H = 2.14;
    g.strokeStyle = `rgba(220,225,235,${0.35 * a * edge})`; g.lineWidth = 1;   // ネット
    for (let k = 0; k <= 6; k++) { const yy = y1 + (y2 - y1) * k / 6; lineW([x, yy, H], [x + dir * 0.8, yy, H], 2, fp); lineW([x + dir * 0.8, yy, H], [x + dir * 1.0, yy, 0], 2, fp); }
    lineW([x + dir * 0.8, y1, H], [x + dir * 0.8, y2, H], 8, fp); lineW([x + dir * 1.0, y1, 0], [x + dir * 1.0, y2, 0], 8, fp);
    const pb = proj(x, GY, 1, fp), lw = pb ? Math.max(2, 0.08 / pb.d * fp) : 2;
    g.strokeStyle = `rgba(255,255,255,${0.95 * a * edge})`; g.lineWidth = lw;
    lineW([x, y1, 0], [x, y1, H], 6, fp); lineW([x, y2, 0], [x, y2, H], 6, fp); lineW([x, y1, H], [x, y2, H], 12, fp);
  }
  // 相手とボール：遠いものから描く
  const objs = [];
  for (const o of W.O) { const p = proj(o.x, o.y, 1.0, fp); if (p) objs.push({ d: p.d, f: () => drawPerson(p, 0.28, W.t - o.voyT < 0.5 ? `rgba(255,110,110,${fill ? 1 : edge})` : `rgba(214,60,60,${fill ? 1 : edge})`, fp, o.x, o.y, fill) }); }
  const bp = proj(B.x, B.y, BR, fp);
  if (bp) objs.push({ d: bp.d, f: () => drawBall(bp, fp, fill, edge) });
  objs.sort((a, b) => b.d - a.d).forEach(o => o.f());
  // 見える練習だけ：画面の外にあるものの向きを文字で（レーダーではなく向きの補助。レベル 2 で消える）
  if (lv === 1 && MODE.m === 'play') {
    g.font = `600 ${Math.round(Math.max(16, CW * 0.018))}px system-ui,sans-serif`; g.textBaseline = 'top';
    const tag = (wx, wy, wz, label, row) => {
      if (onScreen(wx, wy, wz, fp)) return;
      const right = rel(wx, wy).r >= 0, txt = right ? `${label} →` : `← ${label}`;
      g.textAlign = right ? 'right' : 'left'; g.fillStyle = 'rgba(0,0,0,.45)';
      const tw = g.measureText(txt).width, x = right ? CW - 14 : 14, y = 12 + row * 34;
      g.fillRect(right ? x - tw - 8 : x - 8, y - 4, tw + 16, 30); g.fillStyle = 'rgba(255,255,255,.92)'; g.fillText(txt, x, y);
    };
    if (!COACH.hold) tag(B.x, B.y, BR, T.arrowBall, 0);
    tag(PL, GY, 1, T.arrowGoal, 1);
  }
  g.restore();
}
function drawPerson(p, r, col, fp, wx, wy, fill) {   // 人＝円柱の体（0〜1.35 m）と頭
  const foot = proj(wx, wy, 0, fp), top = proj(wx, wy, 1.35, fp), head = proj(wx, wy, 1.55, fp);
  if (!foot || !top) return;
  const w = Math.max(3, r * 2 / p.d * fp), hr = head ? Math.max(2, 0.14 / head.d * fp) : 0;
  if (fill) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(foot.x, foot.y, w * 0.7, w * 0.2, 0, 0, Math.PI * 2); g.fill(); }
  g.beginPath(); g.moveTo(foot.x - w / 2, foot.y); g.lineTo(top.x - w / 2, top.y); g.lineTo(top.x + w / 2, top.y); g.lineTo(foot.x + w / 2, foot.y); g.closePath();
  if (fill) { g.fillStyle = col; g.fill(); } else { g.strokeStyle = col; g.lineWidth = 1.5; g.stroke(); }
  if (head) { g.beginPath(); g.arc(head.x, head.y, hr, 0, Math.PI * 2); if (fill) { g.fillStyle = col; g.fill(); } else g.stroke(); }
}
function drawBall(bp, fp, fill, edge) {   // 白い球＋影（足元に近いときは画面の下に止める）
  const r = clamp(BR / bp.d * fp * 1.3, 4, Math.min(CW, CH) * 0.035), y = Math.min(bp.y, CH - r - 6);
  const sh = proj(W.B.x, W.B.y, 0, fp);
  if (sh && fill) { g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.ellipse(sh.x, Math.min(sh.y, CH - 4), r * 1.2, r * 0.35, 0, 0, Math.PI * 2); g.fill(); }
  if (fill) {
    const gr = g.createRadialGradient(bp.x - r * 0.35, y - r * 0.35, r * 0.1, bp.x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(170,175,185,1)');
    g.globalAlpha = Math.max(fill, 0.75); g.fillStyle = gr; g.beginPath(); g.arc(bp.x, y, r, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  } else { g.strokeStyle = `rgba(255,255,255,${edge})`; g.lineWidth = 2; g.beginPath(); g.arc(bp.x, y, r, 0, Math.PI * 2); g.stroke(); }
}
function drawHoldGlow() {   // 持っている間は画面の下のふちが明るい（どのレベルでも）
  if (!COACH.hold) return;
  const gh = CH * 0.1, gr = g.createLinearGradient(0, CH, 0, CH - gh);
  gr.addColorStop(0, 'rgba(255,240,200,0.32)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(0, CH - gh, CW, gh);
}
function pruneRip(t) { while (RIP.length && t - RIP[0].t0 > 6) RIP.shift(); }
// 見る人用：上から見たピッチ
function drawWatch() {
  g.fillStyle = '#05080b'; g.fillRect(0, 0, CW, CH);
  const pad = 16, sc = Math.min((CW - pad * 2) / (PL + 4), (CH - pad * 2 - 40) / (PW + 2));
  const ox = (CW - (PL + 4) * sc) / 2 + 2 * sc, oy = 40 + (CH - 40 - (PW + 2) * sc) / 2 + sc;
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  g.fillStyle = '#0d2418'; g.fillRect(X(0), Y(0), PL * sc, PW * sc);
  g.strokeStyle = '#2f5f45'; g.lineWidth = 1.5;
  g.strokeRect(X(0), Y(0), PL * sc, PW * sc);
  g.beginPath(); g.moveTo(X(PL / 2), Y(0)); g.lineTo(X(PL / 2), Y(PW)); g.stroke();
  g.beginPath(); g.arc(X(PL / 2), Y(GY), 5 * sc, 0, Math.PI * 2); g.stroke();
  g.setLineDash([4, 5]);
  for (const x of [12, PL - 12]) { g.beginPath(); g.moveTo(X(x), Y(0)); g.lineTo(X(x), Y(PW)); g.stroke(); }
  g.setLineDash([]);
  g.fillStyle = '#2f5f45'; for (const x of [6, 8, PL - 6, PL - 8]) { g.beginPath(); g.arc(X(x), Y(GY), 2.5, 0, Math.PI * 2); g.fill(); }
  // 板
  g.strokeStyle = '#9aa1ab'; g.lineWidth = Math.max(3, sc * 0.25);
  for (const y of [0, PW]) { g.beginPath(); g.moveTo(X(-1), Y(y)); g.lineTo(X(PL + 1), Y(y)); g.stroke(); }
  // ゴール
  g.strokeStyle = '#e8c45a'; g.lineWidth = 3;
  for (const x of [0, PL]) { const d = x ? 1 : -1; g.beginPath(); g.moveTo(X(x), Y(GY - GHW)); g.lineTo(X(x + d * 0.9), Y(GY - GHW)); g.lineTo(X(x + d * 0.9), Y(GY + GHW)); g.lineTo(X(x), Y(GY + GHW)); g.stroke(); }
  g.fillStyle = '#e8c45a'; g.beginPath(); g.arc(X(PL + 1.6), Y(GY), 0.35 * sc, 0, Math.PI * 2); g.fill();
  g.font = '12px system-ui'; g.fillText(LANG === 'ja' ? 'ガイド' : 'guide', X(PL + 1.1), Y(GY) - 0.6 * sc);
  // 波紋
  const t = performance.now() / 1000;
  for (const r of RIP) {
    const age = t - r.t0, life = 1.4 * r.big ** 0.3; if (age > life || age < 0) continue;
    g.strokeStyle = `rgba(${RIPCOL[r.kind]},${0.8 * (1 - age / life)})`; g.lineWidth = 1.5;
    g.beginPath(); g.arc(X(r.x), Y(r.y), (0.2 + age * 1.4 * r.big ** 0.5) * sc, 0, Math.PI * 2); g.stroke();
  }
  pruneRip(t);
  // 自分
  const P = W.P, B = W.B;
  g.fillStyle = '#4b8bd6'; g.beginPath(); g.arc(X(P.x), Y(P.y), PR * sc, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(75,139,214,.35)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(X(P.x), Y(P.y)); g.arc(X(P.x), Y(P.y), 0.9 * sc, P.a - 1.13, P.a + 1.13); g.closePath(); g.stroke();
  g.strokeStyle = '#cfe2ff'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(P.x), Y(P.y)); g.lineTo(X(P.x + Math.cos(P.a) * 1.4), Y(P.y + Math.sin(P.a) * 1.4)); g.stroke();
  // 相手（叫んだ直後は明るい赤）
  for (const o of W.O) {
    g.fillStyle = W.t - o.voyT < 0.5 ? '#ff6b6b' : '#c0392b'; g.beginPath(); g.arc(X(o.x), Y(o.y), PR * sc, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#ffd0d0'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(o.x), Y(o.y)); g.lineTo(X(o.x + Math.cos(o.a) * 1.2), Y(o.y + Math.sin(o.a) * 1.2)); g.stroke();
  }
  // ボール
  const bv = Math.hypot(B.vx, B.vy);
  g.fillStyle = bv > 0.15 ? '#ffffff' : '#7d848d'; g.beginPath(); g.arc(X(B.x), Y(B.y), Math.max(3, BR * sc * 1.6), 0, Math.PI * 2); g.fill();
  if (MODE.m === 'calib' && CAL && CAL.spot) { g.strokeStyle = '#ff7a7a'; g.beginPath(); g.arc(X(CAL.spot.x), Y(CAL.spot.y), 6, 0, Math.PI * 2); g.stroke(); }
  // 文字
  g.fillStyle = '#c9ced6'; g.font = '15px system-ui';
  if (W.type === 'pk') { const k = W.pk; g.fillText(`${LANG === 'ja' ? '上から見る（?watch）' : 'Top view (?watch)'}  PK  A ${k.score.A} - ${k.score.B} B  ${Math.min(PK_N * 2, k.n + 1)}/${PK_N * 2}  ⚽${k.kicker}  🧤${k.keeper}  ${k.phase}${BOT ? '  BOT×' + FAST : ''}`, pad, 26); return; }
  const tl = tally(), st = { play: '', goal: LANG === 'ja' ? 'ゴール！' : 'GOAL!', timeup: LANG === 'ja' ? 'タイムアップ' : 'time up', foul: LANG === 'ja' ? 'ファウル' : 'foul', lost: LANG === 'ja' ? '失点' : 'conceded' }[W.state] || '';
  g.fillText(`${LANG === 'ja' ? '上から見る（?watch）' : 'Top view (?watch)'}  #${W.roundNo} ${T.tname[W.type]}  ${W.roundT.toFixed(1)}s  ${T.touch} ${W.touches}  ${st}   ≤60s ${tl.k}/${tl.m}${BOT ? '  BOT×' + FAST : ''}`, pad, 26);
}

/* ====================== 起動 ====================== */
if (BOT) { hideMenu(); audioInit(); MODE.m = 'play'; }   // W は auto（終わったら自動で次）
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { voiceCache = pickVoice(); };
requestAnimationFrame(frame);
window.G = { get W() { return W; }, MODE, newRound: () => newRound(W), get LV() { return LV; } };
</script>
